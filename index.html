<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>یه سؤال مهم ❤️</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">

        <div class="question-box" id="questionBox">
            <div class="heart-icon">💌</div>

            <h1>برام فیلم می‌فرستی یا نه؟</h1>

            <p>یه سؤال کوچولو دارم ازت... 🥺</p>

            <div class="buttons">
                <button class="yes-button" id="yesButton">
                    آره ❤️
                </button>

                <button class="no-button" id="noButton">
                    نه 🙈
                </button>
            </div>
        </div>

        <div class="success-message" id="successMessage">
            <div class="success-heart">💖</div>

            <h2>می‌دونستم آره می‌گی!</h2>

            <p>غشقم، منتظرم تا بفرستی 😍❤️</p>
        </div>

    </main>

    <script src="app.js"></script>
</body>
</html>
